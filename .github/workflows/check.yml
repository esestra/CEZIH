name: CEZIH Provjera

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instaliraj module
        run: pip install requests beautifulsoup4 pandas openpyxl supabase

      - name: Pokreni skriptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cezih.py

      - name: Spremi stanje
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add zadnje_stanje.txt || echo "Nema datoteke"
          git commit -m "Update stanje" || echo "Nema promjena"
          git push || echo "Nema se što push-ati"
