name: CEZIH Provjera

on:
  schedule:
    - cron: '0 8,16 * * *'  # Automatski u 8:00 i 16:00
  workflow_dispatch:        # Omogućuje ručni klik na gumb

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instaliraj module
        run: pip install requests beautifulsoup4

      - name: Pokreni skriptu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python cezih.py

      - name: Spremi novo stanje
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add zadnje_stanje.txt || echo "Nema promjene"
          git commit -m "Update" || echo "Nema promjene"
          git push || echo "Nema promjene"
