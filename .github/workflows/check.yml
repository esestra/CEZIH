name: CEZIH Provjera
on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instaliraj module
        run: pip install requests beautifulsoup4

      - name: Pokreni skriptu
        run: python cezih.py
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Spremi zadnje stanje
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add zadnje_stanje.txt || echo "Nema promjene"
          git commit -m "Azurirano stanje" || echo "Nema nista za commit"
          git push
